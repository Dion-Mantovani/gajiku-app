<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline - Gajiku</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f172a;
        color: #0f172a;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 28px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        display: block;
        margin: 0 auto 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 24px;
        font-size: 13px;
        line-height: 1.6;
        color: #64748b;
      }

      button {
        width: 100%;
        padding: 14px 20px;
        border: 0;
        border-radius: 16px;
        background: #059669;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>
        Halaman ini belum tersimpan di perangkat. Sambungkan internet, lalu coba
        lagi.
      </p>
      <button type="button" onclick="window.location.reload()">
        Coba lagi
      </button>
    </main>
  </body>
</html>
